services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # АВТОПРОГРЕВ: Принудительно загоняем Llama 3.1
    healthcheck:
      test: ["CMD-SHELL", "ollama run llama3.1 ''"]
      interval: 10s
      timeout: 30s
      retries: 3
  bot:
    build: .
    container_name: ai-telegram-bot
    # Автоматически поднимать бота при сетевых сбоях
    restart: always
    depends_on:
      - ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - BOT_TOKEN=8893907584:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_HOST=http://ollama:11434
      - TZ=Asia/Krasnoyarsk
      # СЮДА ВСТАВЛЯЕТЕ ВАШИ КЛЮЧИ GOOGLE:
      - GOOGLE_API_KEY=
      - GOOGLE_CSE_ID=
    volumes:
      # Надежное сохранение векторной базы Chroma на вашем ПК
      - ./local_assistant_db:/app/local_assistant_db
      # Безопасное монтирование всей папки проекта.
      # SQLite сам внутри создаст нормальный рабочий файл, который не сотрется на вашем ПК.
      - ./:/app

  # НОВЫЙ СЕРВИС: ГРАФИЧЕСКАЯ ПАНЕЛЬ ТРАССИРОВКИ НА ПК
  dashboard:
    build: .
    container_name: mia_dashboard
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    environment:
      - TZ=Asia/Krasnoyarsk
    depends_on:
      - bot

volumes:
  ollama_data:
